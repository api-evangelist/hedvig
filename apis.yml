aid: hedvig
name: Hedvig
description: 'Hedvig is a Swedish insurtech offering mobile-first digital insurance
  to consumers, with more than 200,000 customers managing policies and reporting claims
  through its app. Products span home and apartment (hemförsäkring), villa, car, pet
  (dog and cat), accident, student, and travel insurance, with in-app chat support and
  fast digital claims. Backed by Anthemis and Obvious Ventures, Hedvig operates a
  consumer app over internal APIs and publishes no public developer API surface; this
  network profile captures the company identity, public web properties, and domain
  security posture.'
